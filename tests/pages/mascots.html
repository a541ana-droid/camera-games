<!doctype html><meta charset="utf-8"><body style="margin:0;background:#171429"><canvas id="c" width="1200" height="640"></canvas>
<script src="../../mascot.js"></script><script>
const c=document.getElementById('c').getContext('2d'), M=['happy','wow','sad','cheer'];
for(let m=0;m<4;m++)for(let i=0;i<4;i++)CGMascot.draw(c,i,150+i*300,90+m*150,110,{mood:M[m],look:{x:(i-1.5)/1.5,y:0}},1.3);
</script>
