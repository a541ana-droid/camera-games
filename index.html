<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f0d1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f4fb" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob: 'sha256-kWk1SupbNVOkZQkpxg0qyy1daQSU6A19cie5HQ2d1zY='; style-src 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob: mediastream:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>محرك ألعاب الكاميرا</title>
<style>
:root{color-scheme:dark light;--bg:#0f0d1a;--bg2:#171429;--surface:#1f1b36;--surface-hi:#2a2547;--line:#ffffff1a;--fg:#f4f1ff;--mut:#a9a3c4;--brand:#7c6cff;--on-brand:#0f0d1a;--ok:#3ddc97;--warn:#ffc145;--bad:#ff5d73;--r-s:10px;--r-m:16px;--r-l:24px;--sp:8px;--glass:#0f0d1ad9;--shadow:0 10px 30px -12px #000a;--ease:cubic-bezier(.2,.8,.2,1);--acc:var(--brand);--font:system-ui,-apple-system,"SF Arabic","Noto Sans Arabic","Segoe UI",Tahoma,sans-serif}
@media (prefers-color-scheme:light){:root{--bg:#f6f4fb;--bg2:#fff;--surface:#fff;--surface-hi:#eeeaf7;--line:#1a14301a;--fg:#1a1430;--mut:#5d5778;--brand:#5b4bea;--on-brand:#fff;--ok:#14a46c;--warn:#b07800;--bad:#d1243f;--glass:#f6f4fbe6;--shadow:0 10px 28px -14px #1a143055}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.6 var(--font);overscroll-behavior:none}
[hidden]{display:none!important}
.view{position:fixed;inset:0;overflow:auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:radial-gradient(900px 420px at 85% -8%,color-mix(in srgb,var(--brand) 18%,transparent),transparent 70%),var(--bg)}
h1{font-size:clamp(26px,5vw,34px);line-height:1.25;margin:4px 0 16px;font-weight:800;letter-spacing:0}
button{font:inherit;font-weight:600;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:0 20px;min-height:48px;cursor:pointer;transition:background .2s var(--ease),border-color .2s var(--ease),transform .16s var(--ease),box-shadow .2s var(--ease)}
button:hover{background:var(--surface-hi)}
button:active{transform:scale(.98)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--ac,var(--brand));outline-offset:2px}
button.pri{background:var(--brand);color:var(--on-brand);border-color:transparent;font-weight:700;box-shadow:0 8px 22px -10px var(--brand)}
button.pri:hover{background:color-mix(in srgb,var(--brand) 88%,#fff)}
button.big{min-height:56px;font-size:17px;padding:0 24px}
button:disabled{opacity:.55;cursor:not-allowed}
.row{display:flex;gap:var(--sp);flex-wrap:wrap;align-items:center;margin:12px 0}
label{color:var(--mut);font-size:15px}
select{font:inherit;color:var(--fg);background:var(--surface-hi);border:1px solid var(--line);border-radius:var(--r-s);min-height:48px;padding:0 12px}
.warn{background:color-mix(in srgb,var(--bad) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);border-radius:var(--r-m);padding:12px 16px;line-height:1.7;margin:0 0 16px;font-size:15px}
.card{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 18px;margin:0 0 10px;color:var(--fg);font:inherit;min-height:56px}
.card b{display:block;font-size:18px;margin-bottom:2px}.card small{color:var(--mut);line-height:1.5;font-weight:400}
/* القائمة */
.wrap{max-width:1240px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px;margin:4px 0 24px}
.brandm{display:flex;align-items:center;gap:14px;flex:1 1 240px;min-width:0}
.logo{flex:none;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--brand),#ff6b8b);box-shadow:var(--shadow)}img.logo{background:none;box-shadow:none;border-radius:0;object-fit:contain;filter:drop-shadow(0 6px 14px #7c6cff55)}
.brandm h1{margin:0}.brandm small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.acts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.acts .ico{width:56px;padding:0;font-size:22px}
#inst{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:color-mix(in srgb,var(--brand) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--brand) 45%,transparent);border-radius:var(--r-l);padding:14px 18px;margin:0 0 20px;animation:rise .24s var(--ease) both}#inst[hidden],#inst button[hidden]{display:none}#inst .ii{font-size:30px}#inst .it{flex:1 1 220px;display:grid;gap:2px}#inst .it b{font-size:17px}#inst .it small{color:var(--mut);font-size:14px;line-height:1.6}#inst .ia{display:flex;gap:8px}#inst button{min-height:44px;padding:0 18px}
#settings{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:8px 20px;margin:0 0 24px;box-shadow:var(--shadow);max-width:640px;animation:rise .24s var(--ease) both}
#settings h2{font-size:18px;margin:12px 0 4px}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:56px;border-top:1px solid var(--line);color:var(--fg);font-size:16px}
.set:first-of-type{border-top:0}
.set input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:52px;height:32px;margin:0;border-radius:99px;background:var(--surface-hi);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .2s var(--ease)}
.set input[type=checkbox]::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:24px;height:24px;border-radius:50%;background:var(--mut);transition:inset-inline-start .2s var(--ease),background .2s var(--ease)}
.set input[type=checkbox]:checked{background:var(--brand)}
.set input[type=checkbox]:checked::after{inset-inline-start:23px;background:var(--on-brand)}
.sethint{color:var(--mut);font-size:13px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:20px}
#list .card{padding:0;margin:0;overflow:hidden;border-radius:var(--r-l);display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow);animation:rise .24s var(--ease) both;transition:transform .2s var(--ease),border-color .2s var(--ease),box-shadow .2s var(--ease)}
#list .card:nth-child(2){animation-delay:30ms}#list .card:nth-child(3){animation-delay:60ms}#list .card:nth-child(4){animation-delay:90ms}#list .card:nth-child(5){animation-delay:120ms}#list .card:nth-child(n+6){animation-delay:150ms}
#list .card:hover:not(:disabled){transform:translateY(-3px);border-color:color-mix(in srgb,var(--ac) 70%,transparent);box-shadow:0 18px 36px -16px color-mix(in srgb,var(--ac) 60%,#000)}
#list .card:focus-visible{outline-offset:3px}
.cover{position:relative;display:block;aspect-ratio:16/10;overflow:hidden;background:radial-gradient(120% 90% at 25% 15%,var(--ac-hi),var(--ac) 45%,var(--ac-lo))}
.cover::before,.cover::after{content:"";position:absolute;border-radius:50%;background:#fff;opacity:.13}
.cover::before{width:62%;aspect-ratio:1;inset-inline-end:-14%;bottom:-38%}
.cover::after{width:26%;aspect-ratio:1;inset-inline-start:8%;top:-10%;opacity:.18}
.art{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(56px,9vw,84px);filter:drop-shadow(0 8px 14px #0006);transition:opacity .2s}
.pic{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .2s}
.has .pic{opacity:1}.has .art,.has::before,.has::after{opacity:0}
.body{display:flex;flex-direction:column;gap:6px;padding:16px 18px 18px;flex:1}
#list .card b{font-size:19px;margin:0;line-height:1.3}
#list .card small{font-size:14px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:3em}
.caps{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:auto;padding-top:8px}
.cap{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-hi);font-size:17px;line-height:1}
.badge{display:inline-flex;align-items:center;font-style:normal;font-size:13px;color:var(--mut);border:1px solid var(--line);border-radius:99px;padding:3px 12px;min-height:34px}
#list .card em{display:block;font-style:normal;font-size:14px;line-height:1.5;color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);border-radius:var(--r-s);padding:8px 12px;margin-top:4px}
#list .card:disabled{opacity:1;box-shadow:none}
#list .card:disabled .cover,#list .card:disabled b,#list .card:disabled small,#list .card:disabled .caps{filter:grayscale(1);opacity:.5}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:32px 0 8px}
.foot button{background:transparent;color:var(--mut)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* المسرح */
#stage{position:fixed;inset:0;background:#000;overflow:hidden;--ac:var(--brand)}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam.off{opacity:0;pointer-events:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:transparent}
#launcher{position:absolute;width:1px;height:1px;left:-9px;top:-9px;border:0;visibility:hidden;pointer-events:none}
#hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;align-items:center;pointer-events:none}
#hud .p{background:#0f0d1acc;color:#f4f1ff;border:1px solid #ffffff1f;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:99px;padding:6px 14px;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
#hTitle{flex:1;text-align:center;background:transparent!important;border-color:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;text-shadow:0 1px 4px #000c}
#exit{position:absolute;bottom:max(12px,env(safe-area-inset-bottom));right:max(12px,env(safe-area-inset-right));min-height:48px;padding:0 18px;background:#0f0d1acc;color:#f4f1ff;border-color:#ffffff1f;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:99px}
#ov{position:absolute;inset:0;display:grid;place-items:center;padding:24px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--fg)}
#ov .panel{width:min(100%,460px);background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--ac);border-radius:var(--r-l);padding:28px 24px 24px;text-align:center;box-shadow:var(--shadow);animation:rise .24s var(--ease) both}
#ov.err .panel{border-top-color:var(--bad)}
#ovI{font-size:44px;line-height:1.2}
#ovK{color:var(--mut);font-size:14px;font-weight:600;min-height:0}#ovK:empty{display:none}
#ovT{font-size:clamp(20px,3.4vw,26px);line-height:1.6;white-space:pre-line;font-weight:700;margin:6px 0 4px}
#ov.err #ovT{font-size:18px;font-weight:500;color:var(--fg)}
#ov .row{justify-content:center;margin:18px 0 0}#ov .row button{flex:1 1 140px;min-height:56px}
#perf{position:absolute;left:8px;bottom:8px;z-index:5;font:12px/1.4 ui-monospace,monospace;color:#fff;background:#0009;padding:3px 7px;border-radius:6px;pointer-events:none}#perf:empty{display:none}
#priv{position:fixed;z-index:9;top:max(52px,calc(env(safe-area-inset-top) + 44px));left:8px;right:8px;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#priv>div{display:flex;align-items:center;gap:8px;max-width:100%;background:#0f0d1acc;color:#f4f1ff;border:1px solid #ffffff1f;border-radius:99px;padding:3px 14px;font-size:13px;line-height:1.6;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#priv>div::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--ok)}
#micInd::before{background:var(--bad)!important}
#calib{position:absolute;inset:0;background:#0006;display:flex;align-items:flex-start;justify-content:center;padding-top:20%;font-size:20px;touch-action:none;color:#fff}
#calib span{background:#0f0d1acc;border-radius:var(--r-m);padding:12px 18px}
/* الدوري */
#ser>*{max-width:640px;margin-inline:auto}
#ser>button,#ser>label{display:block}#ser>label{margin-top:18px;margin-bottom:6px;color:var(--mut);font-size:15px}
.shero{display:block;width:100%;aspect-ratio:16/7;object-fit:cover;border-radius:var(--r-l);margin:4px auto 8px;box-shadow:var(--shadow)}
#ser .row{margin:8px auto 16px}
#ser button{min-height:56px}.sbig{width:100%;margin:0 0 10px;font-size:18px}
#ser button.pri{font-size:18px}
.chip{min-width:56px;padding:0 16px}.chip.on{background:var(--brand);color:var(--on-brand);border-color:transparent;font-weight:700}
#ser input[type=text]{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:0 14px;min-height:56px;width:calc(50% - 6px)}
#ser button.card{display:flex;align-items:center;gap:8px;font-weight:600}
#ser button.card.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--surface))}
#ser div.card{border-top:4px solid var(--brand)}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:14px 18px;margin:0 auto 10px;font-size:18px;font-weight:600}
.srow.top{border:2px solid var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}
.srow small{color:var(--mut);display:block;font-size:13px;font-weight:400}.pls{color:var(--ok);font-weight:800}
#dbg{position:fixed;left:6px;bottom:2px;font:11px monospace;color:#8f8;direction:ltr;pointer-events:none}
@media (min-width:1600px){.wrap{max-width:1640px}.grid{grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:28px}#list .card b{font-size:23px}#list .card small{font-size:17px}h1{font-size:40px}.acts button.big{min-height:64px;font-size:20px}.body{padding:20px 22px 22px}#ser>*{max-width:760px}#ov .panel{width:min(100%,680px);padding:40px 36px 32px}#ovI{font-size:64px}#ovT{font-size:34px}#ovK{font-size:18px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="menu" class="view" hidden>
  <div class="wrap">
    <header class="top">
      <div class="brandm"><img class="logo" src="icon.svg" alt="" aria-hidden="true"><div><h1>ألعاب الكاميرا</h1><small id="ver"></small></div></div>
      <div class="acts">
        <button class="pri big" id="playBtn">▶ العب</button>
        <button class="big" id="serBtn">🏆 دوري</button>
        <button class="ico" id="setBtn" aria-label="الإعدادات" aria-expanded="false" aria-controls="settings">⚙️</button>
      </div>
    </header>
    <section id="inst" hidden aria-label="تثبيت التطبيق">
      <span class="ii" aria-hidden="true">📲</span>
      <div class="it"><b>ثبّت الألعاب على جوالك</b><small id="instMsg">تصير أيقونة على الشاشة الرئيسية، وتعمل بلا إنترنت.</small></div>
      <div class="ia"><button class="pri" id="instGo">ثبّت</button><button id="instNo">لاحقًا</button></div>
    </section>
    <section id="settings" hidden aria-label="الإعدادات">
      <h2>الإعدادات</h2>
      <label class="set">الكاميرا <select id="facing"><option value="user" selected>الأمامية</option><option value="environment">الخلفية</option></select></label>
      <label class="set">عرض صورة الكاميرا في الألعاب <input type="checkbox" id="camview" checked></label>
      <p class="sethint">الصورة تبقى على شاشتك ولا تُحفظ ولا تُرسل.</p>
      <label class="set" id="synthL" hidden>مصدر اصطناعي (تجارب) <input type="checkbox" id="synth"></label>
    </section>
    <div id="list" class="grid"></div>
    <div class="foot"><button id="pick">تحميل ملف لعبة</button><input type="file" id="file" accept=".js,text/javascript" hidden></div>
  </div>
</div>
<div id="stage" hidden>
  <video id="cam" class="off" playsinline muted autoplay></video>
  <canvas id="cv" dir="ltr"></canvas>
    <div id="perf" aria-hidden="true"></div>
  <div id="hud"><span class="p" id="hScore" hidden></span><span class="p" id="hTitle" hidden></span><span class="p" id="hTime" hidden></span></div>
  <button id="exit">✕ خروج</button>
  <div id="calib" hidden><span>المس الشيء الذي تريد معايرة لونه</span></div>
  <div id="ov" hidden><div class="panel"><div id="ovI" aria-hidden="true"></div><div id="ovK"></div><div id="ovT" role="status"></div><div class="row"><button class="pri" id="ovA">إعادة</button><button id="ovB">القائمة</button></div></div></div>
</div>
<div id="priv" aria-live="polite"><div id="camind" hidden></div><div id="micInd" hidden>الميكروفون يعمل — لا يُسجَّل ولا يغادر الجهاز</div></div>
<div id="ser" class="view" hidden></div>
<div id="dbg" hidden></div>
<script src="tracker.js?v=044"></script>
<script src="draw.js?v=044"></script>
<script src="mic.js?v=044"></script>
<script src="sensors.js?v=044"></script>
<script src="engine.js?v=044"></script>
<script src="series.js?v=044"></script>
</body>
</html>
